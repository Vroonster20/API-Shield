name: Core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - run: python -m ruff check backend scripts
      - run: python -m pytest -q
      - run: npm ci
      - run: npm run build
